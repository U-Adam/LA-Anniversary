<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurora, choose our LA anniversary</title><style>*{box-sizing:border-box}html,body{margin:0;background:#f7efe7;color:#2c211d;font-family:Inter,system-ui,sans-serif}iframe.planner{display:block;width:100%;height:6400px;border:0;background:#f7efe7}.map-wrap{width:min(1160px,calc(100% - 28px));margin:0 auto 70px;padding:28px;border-radius:28px;background:#302722;color:#fff}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.73rem;font-weight:900;color:#e7c694}.map-wrap h2{font:500 clamp(2.2rem,5vw,3.8rem)/1 Georgia,serif;margin:8px 0 12px}.map-wrap p{color:#d8ccc4;max-width:760px}.map-grid{display:grid;grid-template-columns:320px 1fr;gap:16px;margin-top:20px}.map-list{display:grid;gap:9px;align-content:start}.map-btn{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;border-radius:16px;padding:13px 14px;text-align:left;cursor:pointer}.map-btn.active{background:#e7c694;color:#302722}.map-btn small{display:block;opacity:.75;margin-top:3px}.map-frame{width:100%;min-height:520px;border:0;border-radius:20px;background:#fff}.open-map{display:inline-block;margin-top:12px;color:#fff}.hotel-note{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.08);margin-bottom:10px;color:#e7ddd7}@media(max-width:800px){iframe.planner{height:9100px}.map-grid{grid-template-columns:1fr}.map-frame{min-height:430px}}@media(max-width:500px){iframe.planner{height:9800px}.map-wrap{width:calc(100% - 16px);padding:20px}}</style></head><body><iframe class="planner" src="/index.html" title="LA anniversary planner"></iframe><section class="map-wrap"><div class="eyebrow">Our route, one stop at a time</div><h2>Interactive weekend map</h2><p id="mapIntro">Choose a hotel above and this map will rebuild itself around the places already on our route.</p><div class="map-grid"><div><div class="hotel-note" id="hotelNote">No hotel selected yet.</div><div class="map-list" id="mapList"></div></div><div><iframe id="mapFrame" class="map-frame" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe><a id="openMap" class="open-map" target="_blank" rel="noopener">Open in Google Maps ↗</a></div></div></section><script>const fixed=[{name:'Universal Studios Hollywood',tag:'Friday · open to close',q:'Universal Studios Hollywood'},{name:'Academy Museum',tag:'Saturday morning option',q:'Academy Museum of Motion Pictures'},{name:'LACMA',tag:'Saturday morning option',q:'LACMA Los Angeles'},{name:'TCL Chinese Theatre',tag:'The Odyssey · 2:50 PM',q:'TCL Chinese Theatre Hollywood'},{name:'Fern Dell Trailhead',tag:'Sunday hike',q:'Fern Dell Nature Trail Los Angeles'},{name:'Griffith Observatory',tag:'Sunday view',q:'Griffith Observatory'}];const hotels={"The Delphi":{q:'The Delphi Hotel Los Angeles',spots:[['La Colombe at The Delphi','Inside the hotel'],["Denae's Diner Los Angeles",'Inside the hotel'],['Pitchoun Los Angeles','8-minute walk']]},"The Biltmore":{q:'Millennium Biltmore Hotel Los Angeles',spots:[['Rendezvous Court Biltmore Los Angeles','Inside the hotel'],['Bottega Louie Los Angeles','7-minute walk'],['Grand Central Market Los Angeles','Downtown route']]},"Hollywood Franklin":{q:'Hollywood Franklin Hotel Los Angeles',spots:[['Clark Street Diner Los Angeles','5-minute walk'],['Bourgeois Pig Hollywood','Franklin Village'],['Friends and Family Los Angeles','On the way to Griffith']]},"The LINE LA":{q:'The LINE LA hotel',spots:[['Document Coffee Bar Los Angeles','4-minute walk'],['H Mart Koreatown Los Angeles','Near the hotel'],['Oakobing Los Angeles','Koreatown dessert']]},"Cara Hotel":{q:'Cara Hotel Los Angeles',spots:[['Maru Coffee Los Feliz','On the route'],['Loupiotte Kitchen Los Angeles','Los Feliz lunch'],["Little Dom's Los Angeles",'After the Griffith hike']]},"Los Angeles Athletic Club":{q:'Los Angeles Athletic Club',spots:[['Famous Players Cafe Los Angeles Athletic Club','Inside the club'],['Grand Central Market Los Angeles','12-minute walk'],['Little Damage Los Angeles','6-minute walk']]}};let active='Universal Studios Hollywood';function readState(){try{return JSON.parse(localStorage.getItem('laLove')||'{}')}catch(e){return{}}}function mapUrl(q){return 'https://www.google.com/maps?q='+encodeURIComponent(q)+'&output=embed'}function openUrl(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}function render(){const state=readState(),hotelName=state.hotel&&state.hotel.name,hotel=hotels[hotelName];document.getElementById('hotelNote').textContent=hotelName?'Map centered around '+hotelName+'. Food stops below are the same curated picks shown in the planner.':'Choose a hotel above to add its nearby food stops.';document.getElementById('mapIntro').textContent=hotelName?'This map combines '+hotelName+', its curated coffee and snack stops, and every fixed part of the weekend.':'Choose a hotel above and this map will rebuild itself around the places already on our route.';const points=[];if(hotel){points.push({name:hotelName,tag:'Our hotel',q:hotel.q});hotel.spots.forEach(s=>points.push({name:s[0],tag:s[1],q:s[0]}))}points.push(...fixed);if(!points.some(p=>p.q===active))active=points[0].q;const list=document.getElementById('mapList');list.innerHTML=points.map(p=>`<button class="map-btn ${p.q===active?'active':''}" data-q="${p.q.replace(/"/g,'&quot;')}"><b>${p.name}</b><small>${p.tag}</small></button>`).join('');list.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.q;render()});document.getElementById('mapFrame').src=mapUrl(active);document.getElementById('openMap').href=openUrl(active)}render();setInterval(render,1500);</script></body></html>
